# 自动构建 Docker 镜像并推送到 GHCR。
# 设计依据:docs/CI镜像自动发布计划.md;契约文档:docs/static/ci-docker-publish.md。
# 门禁:quality job 不通过就**不会**构建与推送 —— 坏提交不会变成 latest。
name: 构建并发布镜像

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master] # 只构建、不推送:验证 Dockerfile 没被改坏
  workflow_dispatch:

# 同一 ref 上连续提交只跑最后一次,省额度
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # 最小权限;packages: write 只给下面的 image job

env:
  # GHCR 拒绝大写仓库名:这里写死小写,不依赖自动转换
  IMAGE_NAME: ghcr.io/xs-www/sisicalendar
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: 门禁(ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 uv 与 Python
        # 这个 Action 不发布浮动主版本标签(v10 不存在,只有 v10.x.y),故钉精确版本;
        # 它的 release 是 immutable 的,钉住即长期稳定
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: 安装依赖(严格按 uv.lock)
        run: uv sync --frozen
      - name: 静态检查
        run: uv run ruff check app tests migrations
      - name: 全量测试
        run: uv run pytest -q

  image:
    name: 构建并推送
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 准备 QEMU(构建 arm64 需要)
        uses: docker/setup-qemu-action@v4
      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v4
      - name: 登录 GHCR(PR 不推送,因此不登录)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成标签与 OCI 标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: 构建并推送(linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 老 NAS 的 Docker 对 attestation 清单支持不好,关掉以免报 manifest unknown
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 结果摘要
        if: github.event_name != 'pull_request'
        run: printf '### 镜像已发布\n\n```\n%s\n```\n' "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
