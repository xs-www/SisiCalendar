<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · {{ calendar_name }}</title>
  <link rel="stylesheet" href="{{ asset('css/app.css') }}">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="{{ bp() }}/login">
    <h1>{{ calendar_name }}</h1>
    <p class="muted">家庭成员的登录入口</p>

    {% if notice %}<div class="alert ok">{{ notice }}</div>{% endif %}
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}

    <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
    <input type="hidden" name="next" value="{{ next_url }}">

    <label>用户名
      <input type="text" name="username" autocomplete="username" autofocus required>
    </label>
    <label>口令
      <input type="password" name="password" autocomplete="current-password" required>
    </label>

    <button type="submit" class="primary wide">登录</button>
    <p class="hint">
      忘记口令请联系家庭管理员重置;还没有账号?请向管理员索取邀请码。
    </p>
    <p class="hint">有邀请码了?<a href="{{ bp() }}/register">去注册</a></p>
  </form>
</body>
</html>
